name: compliance-gate

# Never wire this workflow's secrets/variables into a repo you don't own the
# federation subject for. pull_request runs the workflow file AS MODIFIED BY
# THE PR — on a public repo with `pull_request` OIDC, any fork's PR would run
# with these credentials if the federated app registration matched more than
# this exact repo. bootstrap/arm-ci.sh federates to repo:<owner>/<repo> only.
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt -check (every stage)
        run: |
          for stage in stages/*/; do
            echo "::group::fmt $stage"
            terraform -chdir="$stage" fmt -check -recursive
            echo "::endgroup::"
          done

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
      - run: |
          for stage in stages/*/; do
            echo "::group::tflint $stage"
            (cd "$stage" && tflint --init && tflint)
            echo "::endgroup::"
          done

      # Every skip below is a documented, deliberate trade-off, not a blanket
      # suppression — each ID has its own reason. Anything not skipped here
      # must actually pass.
      - name: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: stages/
          quiet: true
          soft_fail: false
          skip_check: >-
            CKV_AZURE_50,
            CKV_AZURE_212,
            CKV_AZURE_225,
            CKV_AZURE_101,
            CKV_AZURE_221,
            CKV2_AZURE_33,
            CKV_AZURE_100,
            CKV_AZURE_140,
            CKV_AZURE_132,
            CKV_AZURE_33,
            CKV_AZURE_43,
            CKV2_AZURE_40,
            CKV2_AZURE_41,
            CKV_AZURE_99,
            CKV_AZURE_59,
            CKV2_AZURE_21,
            CKV2_AZURE_1,
            CKV_AZURE_206
          # CKV_AZURE_50: Y1 consumption plans intentionally lack always-on; not applicable to timer/HTTP functions
          # CKV_AZURE_212/225: Y1 consumption plans don't support fixed instance counts or zone redundancy at all -- targets Premium/Dedicated SKUs
          # CKV_AZURE_101/221/CKV_AZURE_99/CKV2_AZURE_33: public network access / private endpoints / Cosmos network ACLs -- this capstone's Function Apps run without VNET integration; disabling public network access here would break the live pipeline (Cosmos/storage reads/writes) without a larger network redesign out of scope for a capstone. Documented trade-off, not an oversight.
          # CKV_AZURE_59: storage public network access -- same VNET-scope trade-off as above, applied to the storage accounts
          # CKV_AZURE_206: replication -- already improved LRS -> ZRS (real zone-level resilience gain); this check specifically wants geo-redundancy (GRS/RA-GRS), which roughly doubles storage cost for marginal benefit at this capstone's evidence volume
          # CKV_AZURE_100/CKV2_AZURE_1: customer-managed keys (Cosmos + storage) -- platform-managed encryption (Azure default) is sufficient for capstone scope; CMK is a defensible future enhancement
          # CKV_AZURE_140/132: local/key-based auth on Cosmos is ALREADY disabled (local_authentication_enabled = false, verified live against Azure) -- checkov's static analysis doesn't recognize this attribute name as satisfying the check; false positive
          # CKV_AZURE_33/CKV2_AZURE_21: Queue/Blob service read-request logging -- none of our storage accounts use Queue storage, and blob access is already logged at the Cosmos/Function layer via the collector's own runId/collectedAt stamps
          # CKV_AZURE_43: naming-rule check -- false positive; checkov can't statically resolve names built from substr(sha256(...)) interpolation at parse time
          # CKV2_AZURE_40/41: shared-key access / SAS policy on Function runtime storage -- these are the documented func_runtime/reporter_runtime exception (see stages/02-evidence-store/main.tf), and this design never issues SAS tokens at all

  policy-gate:
    runs-on: ubuntu-latest
    needs: static-checks
    strategy:
      matrix:
        stage:
          - 01-foundation
          - 02-evidence-store
          - 03-reporting
          - 04-enforcement
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Native provider OIDC, not azure/login + ARM_USE_CLI: the azurerm
      # provider explicitly refuses "Authenticating using the Azure CLI" when
      # the underlying az session is a Service Principal (which OIDC login
      # always produces) — "only supported as a User". Setting ARM_USE_OIDC
      # lets the provider mint its own token straight from GitHub's OIDC
      # endpoint, no az CLI session involved at all.
      - name: terraform init
        working-directory: stages/${{ matrix.stage }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: terraform init -backend-config="storage_account_name=${{ vars.STATE_STORAGE_ACCOUNT }}"

      - name: terraform plan
        working-directory: stages/${{ matrix.stage }}
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_state_storage_account: ${{ vars.STATE_STORAGE_ACCOUNT }}
          TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json

      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin

      - name: conftest gate (this stage's plan)
        run: conftest test stages/${{ matrix.stage }}/plan.json -p policy/

  policy-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz
          sudo mv conftest /usr/local/bin
      - name: Rules must pass the good example and fail the bad one
        run: |
          conftest test policy/examples/good-plan.json -p policy/
          if conftest test policy/examples/bad-plan.json -p policy/; then
            echo "bad-plan.json should have failed conftest but passed — a rule regressed"
            exit 1
          fi
